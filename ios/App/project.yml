# XcodeGen spec — generates Snappet.xcodeproj.
#   brew install xcodegen && cd ios/App && xcodegen generate && open Snappet.xcodeproj
# Keeps the Xcode project reproducible from source (no binary .pbxproj churn in git).
name: Snappet
options:
  bundleIdPrefix: com.snappet
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  HighlightEngine:
    path: ../HighlightEngine
targets:
  Snappet:
    type: application
    platform: iOS
    sources:
      - path: Snappet
      # Shared wire types (LiveWorkoutMessage) compiled into both the phone and the
      # watch so the WCSession relay has one source of truth.
      - path: Shared
    dependencies:
      - package: HighlightEngine
      # Read-only access to the bundled Kilter catalog (Features/Kilter, `import SQLite3`).
      - sdk: libsqlite3.tbd
      # Embed the watchOS companion so the watch app installs with the phone app.
      - target: SnappetWatch
        embed: true
      # Embed the Widget Extension so the WorkoutTracker Live Activity (overall timer +
      # live HR + current exercise on the Lock Screen / Dynamic Island) ships with the app
      # (live-workout-studio A2).
      - target: SnappetWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Snappet/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app
        DEVELOPMENT_TEAM: 8TRC99V9PN
        # App icon comes from Resources/Assets.xcassets/AppIcon.appiconset
        # (Snappet/ is already a source path, so the catalog + PrivacyInfo.xcprivacy
        # are compiled/bundled automatically — only the icon name needs declaring).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Snappet/Resources/Snappet.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: [health-records]
        com.apple.developer.healthkit.background-delivery: true
  # watchOS companion: runs HKWorkoutSession + HKLiveWorkoutBuilder and relays live HR /
  # energy to the phone over WCSession (live-workout-studio A1).
  SnappetWatch:
    type: application
    platform: watchOS
    sources:
      - path: SnappetWatch
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SnappetWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app.watchkitapp
        DEVELOPMENT_TEAM: 8TRC99V9PN
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.snappet.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: SnappetWatch/SnappetWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
  # Widget Extension: renders the WorkoutTracker Live Activity (overall timer + live HR +
  # current exercise) on the Lock Screen + Dynamic Island. The app target drives it via
  # LiveActivityController; this extension only renders the shared WorkoutActivityAttributes
  # (compiled into both via the Shared/ path — one source of truth, like LiveWorkoutMessage).
  # iOS 18 deployment target; embedded in the phone app above.
  SnappetWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SnappetWidgets
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SnappetWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app.widgets
        DEVELOPMENT_TEAM: 8TRC99V9PN
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  # App unit tests for the PURE pieces (no device): WorkoutActivityMapping +
  # the LiveWorkoutService HR-buffer offset math. Distinct from HighlightEngineTests,
  # which must stay platform-free.
  SnappetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnappetTests
    dependencies:
      - target: Snappet
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snappet.app/Snappet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.unittests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 8TRC99V9PN
        CODE_SIGN_STYLE: Automatic
  SnappetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SnappetUITests
    dependencies:
      - target: Snappet
    settings:
      base:
        TEST_TARGET_NAME: Snappet
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 8TRC99V9PN
        CODE_SIGN_STYLE: Automatic
schemes:
  Snappet:
    build:
      targets:
        Snappet: all
        SnappetWatch: all
        SnappetWidgets: all
        SnappetTests: [test]
        SnappetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnappetTests
        - SnappetUITests
  SnappetWatch:
    build:
      targets:
        SnappetWatch: all
    run:
      config: Debug
