# XcodeGen spec — generates Snappet.xcodeproj.
#   brew install xcodegen && cd ios/App && xcodegen generate && open Snappet.xcodeproj
# Keeps the Xcode project reproducible from source (no binary .pbxproj churn in git).
name: Snappet
options:
  bundleIdPrefix: com.snappet
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HighlightEngine:
    path: ../HighlightEngine
targets:
  Snappet:
    type: application
    platform: iOS
    sources:
      - path: Snappet
    dependencies:
      - package: HighlightEngine
    settings:
      base:
        INFOPLIST_FILE: Snappet/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app
        DEVELOPMENT_TEAM: P6U6C88W9J
        # App icon comes from Resources/Assets.xcassets/AppIcon.appiconset
        # (Snappet/ is already a source path, so the catalog + PrivacyInfo.xcprivacy
        # are compiled/bundled automatically — only the icon name needs declaring).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Snappet/Resources/Snappet.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: [health-records]
        com.apple.developer.healthkit.background-delivery: true
  SnappetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SnappetUITests
    dependencies:
      - target: Snappet
    settings:
      base:
        TEST_TARGET_NAME: Snappet
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Snappet:
    build:
      targets:
        Snappet: all
        SnappetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnappetUITests
