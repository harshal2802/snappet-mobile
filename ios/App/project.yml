# XcodeGen spec — generates Snappet.xcodeproj.
#   brew install xcodegen && cd ios/App && xcodegen generate && open Snappet.xcodeproj
# Keeps the Xcode project reproducible from source (no binary .pbxproj churn in git).
name: Snappet
options:
  bundleIdPrefix: com.snappet
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  HighlightEngine:
    path: ../HighlightEngine
  # On-device climb generator (Features/Kilter/KilterGeneratorRuntime.swift): runs the board-explorer's
  # quantized transformer (model.q.onnx, lazy-downloaded) via ONNX Runtime's Objective-C/Swift API.
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.19.0"
targets:
  Snappet:
    type: application
    platform: iOS
    sources:
      - path: Snappet
      # Shared wire types (LiveWorkoutMessage) compiled into both the phone and the
      # watch so the WCSession relay has one source of truth.
      - path: Shared
    dependencies:
      - package: HighlightEngine
      # ONNX Runtime (ObjC/Swift API) for the on-device climb generator.
      - package: onnxruntime
        product: onnxruntime
      # Read-only access to the user-installed Kilter catalog (Features/Kilter, `import SQLite3`).
      - sdk: libsqlite3.tbd
      # gzip inflate for the Kilter hosted-catalog download (Features/Kilter/KilterAuroraSync.swift).
      - sdk: libz.tbd
      # Embed the watchOS companion so the watch app installs with the phone app.
      - target: SnappetWatch
        embed: true
      # Embed the Widget Extension so the WorkoutTracker Live Activity (overall timer +
      # live HR + current exercise on the Lock Screen / Dynamic Island) ships with the app
      # (live-workout-studio A2).
      - target: SnappetWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Snappet/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app
        DEVELOPMENT_TEAM: NFUS5W8QC6
        # App icon comes from Resources/Assets.xcassets/AppIcon.appiconset
        # (Snappet/ is already a source path, so the catalog + PrivacyInfo.xcprivacy
        # are compiled/bundled automatically — only the icon name needs declaring).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        # Lets Swift catch NSException raised by AVFoundation (e.g. AVPlayerItem.setVideoComposition)
        # via Services/ObjCException — Swift do/catch can't, and an uncaught one aborts the app.
        SWIFT_OBJC_BRIDGING_HEADER: Snappet/Snappet-Bridging-Header.h
    entitlements:
      path: Snappet/Resources/Snappet.entitlements
      properties:
        com.apple.developer.healthkit: true
        # NOTE: no `com.apple.developer.healthkit.access: [health-records]` — the app reads only standard
        # HealthKit (heart rate / workouts), never clinical records. Declaring the unused Health Records
        # capability is an App Review rejection trigger (Guideline 5.1.3).
        com.apple.developer.healthkit.background-delivery: true
        # Phase-end alerts (Pomodoro) keep .timeSensitive through a user's focus mode —
        # without this the system silently downgrades the interruption level (#70).
        com.apple.developer.usernotifications.time-sensitive: true
        # App Group: home-screen widgets + interactive AppIntents (#81) read a small shared
        # Today snapshot (and, from Phase 2, the check-off outbox) the widget extension also
        # reaches. The app AND SnappetWidgets must carry the SAME id (group.com.snappet.app).
        com.apple.security.application-groups: [group.com.snappet.app]
    # Fix ITMS-90208: the embedded onnxruntime.framework's Info.plist declares MinimumOSVersion 15.1,
    # but its binary is compiled for the app's 18.0 deployment target — App Store processing rejects the
    # mismatch. Realign the framework's MinimumOSVersion to the app's target (and re-sign, since this runs
    # after the embed/sign phase). Applies to every build path (local fastlane, GitHub CI, Xcode Cloud).
    postBuildScripts:
      - name: Fix onnxruntime MinimumOSVersion (ITMS-90208)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          FW="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/onnxruntime.framework"
          [ -f "$FW/Info.plist" ] || exit 0
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion ${IPHONEOS_DEPLOYMENT_TARGET}" "$FW/Info.plist"
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$FW"
          fi
  # watchOS companion: runs HKWorkoutSession + HKLiveWorkoutBuilder and relays live HR /
  # energy to the phone over WCSession (live-workout-studio A1).
  SnappetWatch:
    type: application
    platform: watchOS
    sources:
      - path: SnappetWatch
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SnappetWatch/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app.watchkitapp
        DEVELOPMENT_TEAM: NFUS5W8QC6
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.snappet.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: SnappetWatch/SnappetWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
  # Widget Extension: renders the WorkoutTracker Live Activity (overall timer + live HR +
  # current exercise) on the Lock Screen + Dynamic Island. The app target drives it via
  # LiveActivityController; this extension only renders the shared WorkoutActivityAttributes
  # (compiled into both via the Shared/ path — one source of truth, like LiveWorkoutMessage).
  # iOS 18 deployment target; embedded in the phone app above.
  SnappetWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SnappetWidgets
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: SnappetWidgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.app.widgets
        DEVELOPMENT_TEAM: NFUS5W8QC6
        INFOPLIST_KEY_CFBundleDisplayName: Snappet
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: SnappetWidgets/SnappetWidgets.entitlements
      properties:
        # Same App Group as the app target — the widget reads the shared Today snapshot
        # (#81 Phase 1) and, from Phase 2, writes the interactive-check-off outbox the app
        # reconciles into SwiftData on next foreground.
        com.apple.security.application-groups: [group.com.snappet.app]
  # App unit tests for the PURE pieces (no device): WorkoutActivityMapping +
  # the LiveWorkoutService HR-buffer offset math. Distinct from HighlightEngineTests,
  # which must stay platform-free.
  SnappetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SnappetTests
    dependencies:
      - target: Snappet
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snappet.app/Snappet"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.unittests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: NFUS5W8QC6
        CODE_SIGN_STYLE: Automatic
  SnappetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SnappetUITests
    dependencies:
      - target: Snappet
    settings:
      base:
        TEST_TARGET_NAME: Snappet
        PRODUCT_BUNDLE_IDENTIFIER: com.snappet.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: NFUS5W8QC6
        CODE_SIGN_STYLE: Automatic
schemes:
  Snappet:
    build:
      targets:
        Snappet: all
        SnappetWatch: all
        SnappetWidgets: all
        SnappetTests: [test]
        SnappetUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnappetTests
        - SnappetUITests
  SnappetWatch:
    build:
      targets:
        SnappetWatch: all
    run:
      config: Debug
