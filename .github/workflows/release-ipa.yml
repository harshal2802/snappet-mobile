name: Release IPA (ad-hoc OTA)

# Builds an ad-hoc-signed .ipa on every published GitHub Release and attaches the .ipa +
# an OTA manifest.plist to that release. Testers install over-the-air from the GitHub Pages
# install page (docs/install.html) — but only on devices whose UDID is in the provisioning
# profile. See docs/OTA-RELEASE.md for the one-time setup (secrets, Apple Developer steps).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write   # upload assets to the release

jobs:
  build:
    runs-on: macos-15        # Sequoia runner ships Xcode 16 / the iOS 18 SDK
    env:
      TEAM_ID: 8TRC99V9PN
      BUNDLE_ID: com.snappet.app
      SCHEME: Snappet
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/App
        run: xcodegen generate

      - name: Resolve release tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate & provisioning profile
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PWD: ${{ secrets.P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$CERT_B64"    | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

          # A throwaway keychain that holds the distribution cert for this run only.
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null

          # Install the profile and read its Name/UUID (used for manual signing + export).
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Snappet.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          EOF
          # Note: "release-testing" is Xcode 15.3+'s name for the old "ad-hoc" export method.

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Snappet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mv "$RUNNER_TEMP/export/"*.ipa "$RUNNER_TEMP/Snappet.ipa"

      - name: Build OTA manifest.plist
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          IPA_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Snappet.ipa"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" \
            "$RUNNER_TEMP/Snappet.xcarchive/Info.plist" 2>/dev/null || echo "0.1.0")
          cat > "$RUNNER_TEMP/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${BUNDLE_ID}</string>
                  <key>bundle-version</key><string>${VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>Snappet</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

      - name: Upload IPA + manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "$RUNNER_TEMP/Snappet.ipa" "$RUNNER_TEMP/manifest.plist" --clobber

      - name: Print install link
        run: |
          echo "Install page: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/install.html?tag=${{ steps.tag.outputs.tag }}"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "${KEYCHAIN:-$RUNNER_TEMP/app-signing.keychain-db}" || true
