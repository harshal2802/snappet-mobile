name: CI

# PR verification gate, split for speed. It fans out into jobs that run in PARALLEL:
#   • engine — the pure HighlightEngine SwiftPM tests (~1–2 min); an independent fast signal.
#   • app (SnappetTests) — builds the app once and runs ONLY the unit suite → the fast gate (~15 min).
#   • app (SnappetUITests-…) — the end-to-end UI tests, in legs that each build the app and run their share of
#     the UI test classes (`scripts/ci-ui-shard.py`, prompts 261 and 268).
#   • ui-selection — the selection script's own unit tests and `--check` (Linux, seconds).
# SwiftPM checkouts (notably onnxruntime's binary xcframework) are cached between runs.
#
# WHICH UI tests run (prompt 268, user decision 2026-11-18). The full UI suite is 94 classes / 294 tests, about
# 8 hours of machine time in 8 legs; with the few macOS runners a PR waited ~2 h for it, so it no longer runs on
# every PR. The cheap Linux `changes` job lists the changed files and `scripts/ci-ui-shard.py --matrix` turns them
# into the `app` matrix:
#   • pull_request — the PR's own changes (the merge commit vs its first parent):
#       - nothing under ios/ (or only unit tests / docs there)  → SnappetTests only, no macOS UI runner requested
#       - ios/** outside every area (Core, Services, DesignSystem, Shared, project.yml, …)
#                                                               → + `SnappetUITests-smoke` (6 tests, ~5 min)
#       - an app file in an area (racket, workout, kilter, feed, …; the map is in the script), or a UI test /
#         UI test helper file                                   → + smoke + those classes, `SnappetUITests-targeted-KofN`
#         (ceil(tests / 35) legs; 8 legs or more becomes the full suite)
#       - this file or the script changed (unless `ui-quick`), or the PR has the `full-ui` label
#                                                               → the full suite, `SnappetUITests-1of8 … 8of8`
#   • push to main — the same rules on the pushed range (before..after), except that this file and the script do
#     not force the full suite (their PR already ran it). If the range can't be listed: smoke.
#   • schedule (nightly, 08:37 UTC) — the full suite on main; skipped entirely when main has not moved since the
#     previous nightly (if that check fails, it runs).
#   • workflow_dispatch — the full suite, or with the `ui_classes` input (comma-separated class names) unit + exactly
#     those classes in ceil(tests / 35) legs (`SnappetUITests-picked-KofN`). An unknown class name FAILS the
#     `changes` job and nothing runs: the one place that does not fail open (a typo must not become a full run).
#   • PR labels: `ui-quick` → unit + engine + smoke only, whatever changed (even this file); `full-ui` → the full
#     suite. Both → full-ui. Read from the event payload, so a label added later applies from the next push (adding
#     either label also starts a run at once).
# The accepted trade-off: a PR's UI run covers the areas it touches plus the smoke set. A regression it causes in
# ANOTHER area is caught by the next nightly, not before merge (main has no required checks).
#
# Fail-OPEN: on a PR, any error while choosing (the diff, the script, an empty or unparseable result) runs the full
# suite; if the `changes` job fails outright, the `app` matrix falls back to the full suite (`fromJSON(… || […])`).
# On a push the choice fails open to smoke (the nightly is hours away). Unit + engine always run, so they never go
# unreported. To make a merge wait only on the fast checks, require just `engine` + `App tests (SnappetTests)`; never
# a UI leg (their names and number change with the PR).
# release-ipa.yml / testflight.yml are the only other app-compiling workflows (release / dispatch only).

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding `full-ui` or `ui-quick` starts a run with it at once (cancelling the PR's in-flight run).
    # Any other label is a no-op run (every job skipped, in its own concurrency group so it cancels nothing).
    # Labels are read from the event payload, which carries the PR's CURRENT labels on every push too.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '37 8 * * *'    # nightly full UI suite on main (night in US Central)
  workflow_dispatch:
    inputs:
      ui_classes:
        description: 'UI test classes to run, comma-separated (e.g. RacketPlayerUITests,RacketEditUITests). Empty: the full suite.'
        required: false
        default: ''

# Cancel superseded runs of the same PR: a new push to a PR branch cancels its stale in-flight run. Every other run
# (push to main, nightly, dispatch, a no-op label event) gets a group of its own, so nothing cancels it and it never
# waits as "pending" behind another run (a pending run in a group is replaced by the next one, which would drop a
# nightly or a merge's check).
concurrency:
  group: ${{ (github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'full-ui' && github.event.label.name != 'ui-quick')) && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap Linux gate that decides which app-test legs the macOS `app` job runs. Outputs the `app` matrix (a JSON list
  # of {suite, classes}) and `skip` (nightly with nothing new on main). Runs in ~20 s.
  changes:
    name: Choose the app test legs
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ui' && github.event.label.name != 'ui-quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read    # the nightly reads the previous nightly's commit
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      # Depth 2: on a PR, HEAD is GitHub's merge commit and its first parent is the base tip, so `HEAD^1..HEAD` is
      # exactly what the PR changes against today's base. A push fetches its `before` commit below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Choose the legs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          UI_CLASSES: ${{ github.event.inputs.ui_classes }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail   # no -e: every failure below falls back on purpose
          S=scripts/ci-ui-shard.py
          CHANGED="$RUNNER_TEMP/changed.txt"
          matrix=""
          case "$EVENT" in
            pull_request)
              # The labels full-ui (full) and ui-quick (smoke only) override the paths; both → full-ui.
              if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] \
                 && git diff --name-only --no-renames HEAD^1 HEAD > "$CHANGED"; then
                cat "$CHANGED"
              else
                echo "::warning title=Changed files unknown::could not list the PR's changed files; full suite unless a label says otherwise"
                : > "$CHANGED"   # empty: the script falls back to full (after the labels)
              fi
              matrix=$(python3 "$S" --matrix "$CHANGED" --fallback full --labels "$LABELS") ;;
            push)
              # A new branch or a force push has no usable `before`: smoke (the nightly runs everything).
              if [[ ! "$BEFORE" =~ ^0*$ ]] && git fetch --no-tags --depth=1 origin "$BEFORE" \
                 && git diff --name-only --no-renames "$BEFORE" "$GITHUB_SHA" > "$CHANGED"; then
                cat "$CHANGED"
                matrix=$(python3 "$S" --matrix "$CHANGED" --push --fallback smoke)
              else
                echo "::warning title=Smoke UI only::could not list the pushed range ${BEFORE}..${GITHUB_SHA}"
                matrix=$(python3 "$S" --matrix --smoke)
              fi ;;
            schedule)
              # The newest finished nightly (success or failure; cancelled ones don't count). Same commit → nothing to do.
              prev=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&status=completed&per_page=20" \
                --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""') \
                || prev=""
              if [ -n "$prev" ] && [ "$prev" = "$GITHUB_SHA" ]; then
                echo "::notice title=Nightly skipped::main is still at ${GITHUB_SHA}, which the previous nightly ran"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              matrix=$(python3 "$S" --matrix --full) ;;
            workflow_dispatch)
              # ui_classes: exactly those classes. An unknown name FAILS this job (not fail-open: a typo must not
              # become a 2-hour full run), and `app` must not then fall back to the full suite either.
              if [ -n "${UI_CLASSES// /}" ]; then
                if ! matrix=$(python3 "$S" --matrix --classes "$UI_CLASSES"); then
                  echo "::error title=ui_classes::unknown UI test class in '$UI_CLASSES' (see above); nothing was run"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
              else
                matrix=$(python3 "$S" --matrix --full)
              fi ;;
            *)
              matrix=$(python3 "$S" --matrix --full) ;;
          esac
          # Only a non-empty JSON list of {suite, …} goes out. Anything else leaves the output empty, and the `app`
          # matrix expands its full fallback.
          if printf '%s' "$matrix" | python3 -c 'import json, sys; m = json.load(sys.stdin); sys.exit(0 if isinstance(m, list) and m and all(isinstance(r, dict) and r.get("suite") for r in m) else 1)'; then
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            legs=$(printf '%s' "$matrix" | python3 -c 'import json, sys; print(" ".join(r["suite"] for r in json.load(sys.stdin)))')
            echo "::notice title=App test legs::$legs"
          else
            echo "::warning title=Full UI suite::no usable matrix from the selection; the app job runs everything"
          fi

  # The UI selection's own tests and the shard/area check, on Linux in seconds, so a broken map shows up here and
  # not only inside a macOS leg.
  ui-selection:
    name: UI selection script tests
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'full-ui' && github.event.label.name != 'ui-quick') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests of scripts/ci-ui-shard.py
        run: python3 -m unittest discover -s scripts -p 'test_ci_ui_shard.py' -v
      - name: Shards, areas and the workflow fallback agree
        run: python3 scripts/ci-ui-shard.py --check

  engine:
    name: HighlightEngine (pure SwiftPM)
    needs: changes
    # Runs even if `changes` failed; skipped only for a no-op label event or a nightly with nothing new.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.skip != 'true' }}
    runs-on: macos-26          # Tahoe runner — Xcode 26.5, the shipping toolchain (see decisions.md)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: HighlightEngine unit tests
        working-directory: ios/HighlightEngine
        run: swift test

  app:
    name: App tests (${{ matrix.suite }})
    needs: changes
    # Run even if `changes` fails (e.g. an API hiccup): `!cancelled()` overrides the implicit "skip a job whose
    # `needs` failed", and the fromJSON fallback below then expands the FULL matrix — so a broken gate degrades to
    # "run everything", never to silently losing the unit signal. Skipped only for a no-op label event (`changes`
    # skipped) or a nightly with nothing new (`skip`). The one exception to failing open: a manual dispatch with
    # `ui_classes` whose `changes` job failed (an unknown class) runs nothing rather than the full fallback.
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.skip != 'true' && !(github.event_name == 'workflow_dispatch' && github.event.inputs.ui_classes != '' && needs.changes.result != 'success') }}
    runs-on: macos-26
    # 90, not 60: the UI suite outgrew the old ceiling and started being CANCELLED at exactly
    # 60:00 mid-run — which surfaces as a red check with ZERO test failures, so it reads like a
    # regression and hides real ones behind it. Measured 2026-08-03 on PR #303: every test passed
    # and the job was killed with ~2 suites left. Note `-test-iterations 3` below multiplies the
    # cost of any flake, so the ceiling has to clear the retried worst case, not the happy path.
    # The unit leg finishes in ~10 min and is unaffected by the larger number.
    # 2026-11-16 (prompt 261): the ceiling stays, the UI suite is now split into legs of ~34 tests each,
    # because one leg could no longer fit under any sane ceiling. Six legs was tried first: four finished
    # in 47–66 min, two hit 90 (one with 77 min of slow-but-green racket tests, one retrying real failures).
    # 2026-11-18 (prompt 268): targeted legs hold at most ~35 tests too, so the same ceiling fits them.
    timeout-minutes: 90
    strategy:
      fail-fast: false         # a UI failure must not cancel the unit-test signal (and vice-versa)
      matrix:
        # Rows from `changes`: {"suite":"SnappetTests"}, full legs {"suite":"SnappetUITests-KofN"} (the leg recomputes
        # its classes from the same sources), and smoke / targeted legs that carry their class list
        # {"suite":"SnappetUITests-targeted-1of2","classes":"A B …"} so `changes` and the leg cannot disagree.
        # The `|| '[…]'` fallback is the full matrix, used when `changes` produced no output (job failed); it must
        # match FULL_LEGS in the script (`ci-ui-shard.py --check` verifies it).
        include: ${{ fromJSON(needs.changes.outputs.matrix || '[{"suite":"SnappetTests"},{"suite":"SnappetUITests-1of8"},{"suite":"SnappetUITests-2of8"},{"suite":"SnappetUITests-3of8"},{"suite":"SnappetUITests-4of8"},{"suite":"SnappetUITests-5of8"},{"suite":"SnappetUITests-6of8"},{"suite":"SnappetUITests-7of8"},{"suite":"SnappetUITests-8of8"}]') }}
    env:
      SCHEME: Snappet
      SPM_CACHE: ${{ github.workspace }}/.spm-cache
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain the app is built & shipped on (decisions.md 2026-06-16) — same as the release
      # workflows; NOT the runner's drifting `latest-stable`.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # Cache the resolved SwiftPM checkouts (notably onnxruntime's prebuilt xcframework) so each run
      # doesn't re-fetch them. Keyed on project.yml, which pins the package versions.
      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ runner.os }}-xcode26.5-${{ hashFiles('ios/App/project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode26.5-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios/App
        run: xcodegen generate

      # Resolve a concrete simulator (rather than OS=latest) so the destination matches a runtime the
      # selected Xcode actually has installed.
      - name: Resolve an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available on the runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot it now so it settles during the ~8-minute build (prompt 267): booted by xcodebuild right before the
          # first test, the first app launch on a leg timed out ("Failed to get launch progress", run 43935201896).
          xcrun simctl boot "$UDID" || xcrun simctl list devices | grep "$UDID"

      - name: Build & run ${{ matrix.suite }} on the simulator
        working-directory: ios/App
        env:
          SUITE: ${{ matrix.suite }}
          CLASSES: ${{ matrix.classes }}
        run: |
          set -euo pipefail
          # "SnappetTests" runs the whole unit bundle. A UI leg with `classes` (smoke / targeted) runs exactly those;
          # "SnappetUITests-KofN" without them runs leg K of N of the full suite (the script reads the sources, so a
          # new test class lands in a leg with no list to edit).
          ONLY=()
          if [ -n "$CLASSES" ]; then
            python3 ../../scripts/ci-ui-shard.py --check
            while IFS= read -r arg; do ONLY+=("$arg"); done \
              < <(python3 ../../scripts/ci-ui-shard.py --only "$CLASSES")
          elif [[ "$SUITE" =~ ^SnappetUITests-([0-9]+)of([0-9]+)$ ]]; then
            python3 ../../scripts/ci-ui-shard.py --check "${BASH_REMATCH[2]}"
            while IFS= read -r arg; do ONLY+=("$arg"); done \
              < <(python3 ../../scripts/ci-ui-shard.py "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}")
          elif [ "$SUITE" = "SnappetTests" ]; then
            ONLY=("-only-testing:SnappetTests")
          else
            echo "::error::unknown suite $SUITE (a UI leg needs classes or the KofN form)" >&2; exit 1
          fi
          [ "${#ONLY[@]}" -gt 0 ] || { echo "::error::no test classes for $SUITE" >&2; exit 1; }
          printf '%s\n' "${ONLY[@]}"
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            "${ONLY[@]}" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -resultBundlePath "$RUNNER_TEMP/${{ matrix.suite }}.xcresult" \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}.xcresult
          path: ${{ runner.temp }}/${{ matrix.suite }}.xcresult
          if-no-files-found: ignore
