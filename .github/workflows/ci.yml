name: CI

# PR verification gate: builds the app and runs the unit + UI test suites on the iOS simulator
# (no signing required) plus the pure HighlightEngine SwiftPM tests. Runs on every pull request
# (any base branch, so stacked feature PRs are gated too) and on pushes to main.
# NOTE: release-ipa.yml / testflight.yml only run on a published release or manual dispatch — this
# is the only workflow that verifies a PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (engine + app on the simulator)
    # macOS 26 (Tahoe) runner — it carries Xcode 26.5, the toolchain the app is developed and shipped on.
    # This MUST match the team's local Xcode: the older macos-15 image tops out at Xcode 26.3 (whose Swift
    # type-checker times out — "unable to type-check this expression in reasonable time" — on a couple of
    # the app's complex SwiftUI expressions) and Xcode 16.4 (whose older Swift 6.0 actor-isolation rules
    # reject View code that 26.5 accepts). Both are compiler-version artefacts, not real defects, so CI
    # verifies against the same 26.5 toolchain that actually ships the app.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: Snappet
    steps:
      - uses: actions/checkout@v4

      # Pin the exact toolchain the team builds on locally (Xcode 26.5) instead of the runner's drifting
      # default — prefer 26.5, fall back to the newest installed Xcode 26.x — and record the inventory.
      - name: Select Xcode 26.5 (the shipping toolchain) and print the inventory
        run: |
          set -euo pipefail
          echo "== Installed Xcodes =="
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then
            XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26.x installed on the runner" >&2
            exit 1
          fi
          echo "== Selecting $XC =="
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: HighlightEngine unit tests (pure SwiftPM, no Xcode project)
        working-directory: ios/HighlightEngine
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios/App
        run: xcodegen generate

      # Resolve a concrete simulator (rather than OS=latest) so the destination matches whatever iOS
      # runtime the runner actually has installed for the selected Xcode.
      - name: Resolve an available iOS simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No iPhone simulator available on the runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run the test suite on the simulator
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/Snappet.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snappet.xcresult
          path: ${{ runner.temp }}/Snappet.xcresult
          if-no-files-found: ignore
