name: CI

# PR verification gate: builds the app and runs the unit + UI test suites on the iOS simulator
# (no signing required) plus the pure HighlightEngine SwiftPM tests. Runs on every pull request
# (any base branch, so stacked feature PRs are gated too) and on pushes to main.
# NOTE: release-ipa.yml / testflight.yml only run on a published release or manual dispatch — this
# is the only workflow that verifies a PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (engine + app on the simulator)
    runs-on: macos-15        # Sequoia → Xcode 16 / the iOS 18 SDK + simulators
    timeout-minutes: 60
    env:
      SCHEME: Snappet
    steps:
      - uses: actions/checkout@v4

      # The macos-15 runner's `latest-stable` has moved to Xcode 26.x (whose Swift type-checker times
      # out on the app's complex expressions), while the newest Xcode 16 (16.4) is stricter about Swift 6
      # concurrency than the toolchain this app was actually built and shipped on. Select the OLDEST
      # installed Xcode 16.x — the closest match to that shipping toolchain — and print the full
      # inventory so the exact version is recorded in the log.
      - name: Select Xcode 16.x (oldest installed) and print the inventory
        run: |
          set -euo pipefail
          echo "== Installed Xcodes =="
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | head -1 || true)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 16.x installed on the runner" >&2
            exit 1
          fi
          echo "== Selecting $XC =="
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: HighlightEngine unit tests (pure SwiftPM, no Xcode project)
        working-directory: ios/HighlightEngine
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios/App
        run: xcodegen generate

      - name: Installed iOS simulator runtimes (diagnostic)
        run: xcrun simctl list runtimes

      # Compile the app + test targets against a GENERIC simulator — this needs only the iphonesimulator
      # SDK (bundled with Xcode), not an installed iOS runtime, so it isolates "does it compile?" from the
      # runtime-availability problem. Running the suite is restored once the toolchain is settled.
      - name: Build for testing (generic iOS Simulator — compiles app + tests, no runtime needed)
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath "$RUNNER_TEMP/Snappet.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcresult bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Snappet.xcresult
          path: ${{ runner.temp }}/Snappet.xcresult
          if-no-files-found: ignore
