name: CI

# PR verification gate. For now this runs ONLY the pure, programmatic HighlightEngine tests
# (`swift test` — no Xcode project, no simulator), keeping CI to ~2 min.
#
# The app build + the simulator-bound suites (SnappetTests — which includes StopwatchTimingTests —
# and SnappetUITests) are COMMENTED OUT below: they're slow (~15 min unit / ~30 min UI) and remain
# owed at the merge gate (see each PR's verification checklist). Re-enable by uncommenting `app`.
#
# ⚠️ Trade-off: with the app build off, CI no longer catches app compile errors (Swift 6 strict
# concurrency / "unable to type-check this expression") — those now surface only at the merge-gate
# xcodebuild run, not on the PR. (A compile-only `build-for-testing` job is the middle ground if we
# want that safety back without the slow test run.)
#
# release-ipa.yml / testflight.yml are the only other app-compiling workflows (release / dispatch only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: HighlightEngine (pure SwiftPM)
    runs-on: macos-26          # Tahoe runner — Xcode 26.5, the shipping toolchain (see decisions.md)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - name: HighlightEngine unit tests
        working-directory: ios/HighlightEngine
        run: swift test

